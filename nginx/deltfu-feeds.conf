# AdFeed AI — Feed 静态文件服务配置
# 部署方法：复制到 /etc/nginx/snippets/deltfu-feeds.conf
# 并在 server {} 内 include（见 nginx/deltfu.com.conf）
# 然后执行: sudo nginx -t && sudo systemctl reload nginx
#
# Durable layout: /feeds/{store_id}/{platform}/{lang}.xml|csv
# Legacy flat:    /feeds/{store_id}/{lang}.xml

location /feeds/ {
    alias /opt/adfeed/phase0/feeds/;

    expires 1h;
    add_header Cache-Control "public, must-revalidate";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With" always;

    types {
        application/xml xml;
        text/csv csv;
        text/plain txt;
    }

    autoindex off;
    sendfile on;
    tcp_nopush on;

    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        return 204;
    }
}
