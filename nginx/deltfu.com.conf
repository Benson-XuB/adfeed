# AdFeed AI — production nginx site for deltfu.com
# Install: cp to /etc/nginx/sites-available/deltfu.com && ln -s sites-enabled/
# TLS paths are created by certbot; HTTP-only block works before certbot.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name deltfu.com www.deltfu.com;

    client_max_body_size 200M;

    include /etc/nginx/snippets/deltfu-feeds.conf;

    location /webhooks/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/(customers/(data_request|redact)|shop/redact)/?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Listing / compliance URLs stay on FastAPI (not marketing HTML)
    location ~ ^/(docs|openapi\.json|privacy|support)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marketing landing (static). /lp-assets/ avoids clash with Shopify app /assets/.
    # Embedded app opens https://deltfu.com/?shop=...&host=... → proxy to React.
    location = / {
        error_page 418 = @shopify_app_root;
        if ($arg_shop != "") { return 418; }
        if ($arg_host != "") { return 418; }
        root /opt/adfeed/landing-page;
        try_files /index.html =404;
    }
    location @shopify_app_root {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
    location = /styles.css {
        root /opt/adfeed/landing-page;
        try_files /styles.css =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /privacy.html {
        root /opt/adfeed/landing-page;
        try_files /privacy.html =404;
    }
    location = /terms.html {
        root /opt/adfeed/landing-page;
        try_files /terms.html =404;
    }
    location = /support.html {
        root /opt/adfeed/landing-page;
        try_files /support.html =404;
    }
    location /lp-assets/ {
        alias /opt/adfeed/landing-page/assets/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Shopify embedded app + auth
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

# After certbot, it adds a second server {} on :443 with the same locations.
# Re-run: certbot --nginx -d deltfu.com -d www.deltfu.com
