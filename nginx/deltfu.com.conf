# AdFeed AI — production nginx for deltfu.com
# Includes Let's Encrypt TLS. Do NOT replace this with an HTTP-only stub on the server.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name deltfu.com www.deltfu.com;

    client_max_body_size 200M;

    ssl_certificate /etc/letsencrypt/live/deltfu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deltfu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/deltfu-feeds.conf;

    location /webhooks/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/(customers/(data_request|redact)|shop/redact)/?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Listing / compliance URLs stay on FastAPI (not marketing HTML)
    location ~ ^/(docs|openapi\.json|privacy|support)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marketing landing. Embedded app: ?shop= or ?host= → React on :3000.
    location = / {
        error_page 418 = @shopify_app_root;
        if ($arg_shop != "") { return 418; }
        if ($arg_host != "") { return 418; }
        root /opt/adfeed/landing-page;
        try_files /index.html =404;
    }
    location @shopify_app_root {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
    location = /styles.css {
        root /opt/adfeed/landing-page;
        try_files /styles.css =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        root /opt/adfeed/landing-page;
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600";
        default_type application/xml;
    }
    location = /robots.txt {
        root /opt/adfeed/landing-page;
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600";
        default_type text/plain;
    }
    location = /privacy.html {
        root /opt/adfeed/landing-page;
        try_files /privacy.html =404;
    }
    location = /terms.html {
        root /opt/adfeed/landing-page;
        try_files /terms.html =404;
    }
    location = /support.html {
        root /opt/adfeed/landing-page;
        try_files /support.html =404;
    }
    location = /setup.html {
        root /opt/adfeed/landing-page;
        try_files /setup.html =404;
    }
    location = /waitlist {
        root /opt/adfeed/landing-page;
        try_files /waitlist.html =404;
    }
    location = /waitlist.html {
        return 301 /waitlist;
    }
    location = /waitlist.js {
        root /opt/adfeed/landing-page;
        try_files /waitlist.js =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /tools {
        return 301 /tools/;
    }
    location = /tools/ {
        root /opt/adfeed/landing-page;
        try_files /tools/index.html =404;
    }
    location = /tools/feed-checker {
        root /opt/adfeed/landing-page;
        try_files /tools/feed-checker.html =404;
    }
    location = /tools/google-issues {
        root /opt/adfeed/landing-page;
        try_files /tools/google-issues.html =404;
    }
    location = /tools/google-ads-monitor {
        root /opt/adfeed/landing-page;
        try_files /tools/google-ads-monitor.html =404;
    }
    location = /tools/feed-checker.js {
        root /opt/adfeed/landing-page;
        try_files /tools/feed-checker.js =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /tools/google-issues.js {
        root /opt/adfeed/landing-page;
        try_files /tools/google-issues.js =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /tools/google-ads-monitor.js {
        root /opt/adfeed/landing-page;
        try_files /tools/google-ads-monitor.js =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /guides {
        return 301 /guides/;
    }
    location = /guides/ {
        root /opt/adfeed/landing-page;
        try_files /guides/index.html =404;
    }
    location = /guides/google-shopping-disapproved {
        root /opt/adfeed/landing-page;
        try_files /guides/google-shopping-disapproved.html =404;
    }
    location = /guides/google-shopping-feed-errors {
        root /opt/adfeed/landing-page;
        try_files /guides/google-shopping-feed-errors.html =404;
    }
    location = /guides/1688-google-shopping {
        root /opt/adfeed/landing-page;
        try_files /guides/1688-google-shopping.html =404;
    }
    location = /guides/1688-products-need-gtin {
        root /opt/adfeed/landing-page;
        try_files /guides/1688-products-need-gtin.html =404;
    }
    location = /guides/1688-supplier-brand-vs-google-shopping-brand {
        root /opt/adfeed/landing-page;
        try_files /guides/1688-supplier-brand-vs-google-shopping-brand.html =404;
    }

    location /lp-assets/ {
        alias /opt/adfeed/landing-page/assets/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Shopify embedded app + auth
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name deltfu.com www.deltfu.com;
    return 301 https://$host$request_uri;
}
