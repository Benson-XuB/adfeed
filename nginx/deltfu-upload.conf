# AdFeed AI — Nginx 上传优化配置
# 部署方法：复制到服务器 /etc/nginx/conf.d/deltfu-upload.conf
# 然后执行: sudo nginx -t && sudo systemctl reload nginx

# ── 全局上传限制（放在 http 块或 server 块内）──
client_max_body_size 200M;
client_body_timeout 300s;
client_header_timeout 60s;

# ── 上传接口专用优化 ──
location /api/upload {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 关键：关闭请求体缓冲，数据直接流式转发到后端
    # 否则 nginx 会先把 200MB 文件完整缓存到 /tmp 再转发 = 双倍等待
    proxy_request_buffering off;
    proxy_buffering off;

    # 超时设置（大文件需要更长时间）
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;
}
