version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adfeed
      POSTGRES_USER: adfeed
      POSTGRES_PASSWORD: adfeed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://adfeed:adfeed@postgres:5432/adfeed
      REDIS_URL: redis://redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      PYTHONPATH: /app:/phase0
    volumes:
      - ./backend:/app
      - ./phase0:/phase0
    depends_on:
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: python:3.10-slim
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    environment:
      API_BASE_URL: http://api:8000
    command: |
      sh -c "pip install -r requirements.txt && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - api

volumes:
  pgdata:
